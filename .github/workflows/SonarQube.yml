name: SonarQube Quality Check

on:
  push:
    branches: [ "v3.x/staging" ]
  pull_request:
    branches: [ "v3.x/staging" ]
    types: [opened, synchronize, reopened, ready_for_review]


jobs:
  analyze-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout PR head with limited history
        uses: actions/checkout@v4
        with:
          ref: v3.x/staging


      - name: SonarQube Scan
        continue-on-error: false
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
          sonar.projectVersion: ${{ env.P_VERSION }}
          sonar.links.ci: 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'

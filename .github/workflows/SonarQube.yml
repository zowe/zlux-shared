name: SonarQube Quality Check

on:
  push:
    branches: [ "v3.x/staging" ]
  pull_request:
    branches: [ "v3.x/staging" ]
    types: [opened, synchronize, reopened, ready_for_review]


jobs:
  analyze-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout PR head with limited history
        uses: actions/checkout@v4
        with:
          ref: v3.x/staging


      - name: SonarQube Scan
        continue-on-error: false
        uses: sonarsource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=zowe_zlux-shared
            -Dsonar.organization=zowe
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.branch.name=v3.x/staging
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/*.spec.js,**/*.test.js,**/*.spec.jsx,**/*.test.jsx
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**
            -Dsonar.javascript.lcov.reportPaths=src/coverage/lcov.info
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

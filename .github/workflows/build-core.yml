name: Trigger ZLUX Core Build

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - v3.x/staging

jobs:
  build-core:
    uses: zowe/zlux-build/.github/workflows/build-core.yml@users/jstruga/add-trigger-option
    secrets:
      SSH_MARIST_USERNAME: ${{ secrets.SSH_MARIST_USERNAME }}
      SSH_MARIST_RACF_PASSWORD: ${{ secrets.SSH_MARIST_RACF_PASSWORD }}
    with:
      SOURCE_REPO: zlux-platform
      SOURCE_PR: ${{ github.event.pull_request.number || '' }}

      ZLUX_PLATFORM: ${{ github.event.pull_request.number || '' }}
